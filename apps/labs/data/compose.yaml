name: ducker-lab-data

services:
  postgres:
    image: postgres:19.0-alpine3.24
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:${LAB_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, lab, -d, lab]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.12.0-alpine3.23
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:${LAB_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, "redis-cli ping | grep -qx PONG"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
