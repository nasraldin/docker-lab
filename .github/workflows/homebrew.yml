name: Homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0). Defaults to latest release."
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish-tap:
    name: Publish formula to homebrew-tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="${INPUT_TAG}"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(gh release view --json tagName -q .tagName)"
          fi
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$ ]] || { echo "Expected a version tag such as v1.0.1" >&2; exit 1; }
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Publishing Homebrew formula for ${TAG}"

      - name: Check tap deploy key
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          [[ -n "${HOMEBREW_TAP_DEPLOY_KEY}" ]] ||
            { echo "::error::Set HOMEBREW_TAP_DEPLOY_KEY. See docs/homebrew.md."; exit 1; }

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: nasraldin/homebrew-tools
          ref: main
          path: homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Publish to nasraldin/homebrew-tools
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          TAP_CHECKOUT: ${{ github.workspace }}/homebrew-tap
        run: ./scripts/publish-homebrew.sh "${RELEASE_TAG}"
